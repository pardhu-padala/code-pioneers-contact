    <meta charset="UTF-8">

    <title>Our Team</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header p {
            color: #cccccc;
            font-size: 17px;
        }

        .team {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .member {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .member:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .member img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 18px;
        }

        .member h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.03);
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #f09433,
                #e6683c,
                #dc2743,
                #cc2366,
                #bc1888
            );
        }

        .whatsapp {
            background: #25D366;
        }

        .gmail {
            background: #EA4335;
        }

        footer {
            text-align: center;
            margin-top: 45px;
            color: #aaaaaa;
            font-size: 14px;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .team {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 32px;
            }

            .team {
                grid-template-columns: 1fr;
            }

            .member {
                max-width: 400px;
                margin: auto;
                width: 100%;
            }
        }
    </style>
</head>
